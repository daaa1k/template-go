# tagpr: opens/updates a release PR from main; merging it tags main and publishes a GitHub Release.
# After a full semver tag (e.g. v1.0.0), action-update-semver also moves the major tag (e.g. v1).
# Repository Settings → Actions → General: enable "Allow GitHub Actions to create and approve pull requests".
name: tagpr

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tagpr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
    timeout-minutes: 60
    steps:
      - name: Check out source code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - id: tagpr
        name: Run tagpr
        uses: Songmu/tagpr@d1b8138b7a31075141b6cd64103de9485ced7ac9 # v1.20.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
